# Engineering Agent — picks up issues labeled `agent-ready`, makes the
# changes via Claude Code in headless mode, opens a PR. Never pushes to
# main; the merge is always a human decision.
#
# Cost expectation per run: roughly $0.20 - $2.00 in API tokens depending
# on task size (Claude Sonnet 4.x at ~$3/1M input, $15/1M output).

name: Engineering Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write       # push the agent's branch
  pull-requests: write  # open the PR
  issues: write         # comment back on the issue

jobs:
  run:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name  "lunchpad-eng-agent"
          git config user.email "eng-agent@lunchpad.us"

      - name: Create branch
        id: branch
        run: |
          BRANCH="agent/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run engineering agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY:  ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash scripts/agent/run-eng.sh

      - name: Typecheck before pushing
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Commit + push
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "Agent produced no changes — failing run."
            exit 1
          fi
          git add -A
          git commit -m "Agent: ${{ github.event.issue.title }} (closes #${{ github.event.issue.number }})"
          git push -u origin "${{ steps.branch.outputs.name }}"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "[agent] ${{ github.event.issue.title }}" \
            --body "Closes #${{ github.event.issue.number }}. Auto-generated by the engineering agent. Vercel preview will deploy automatically; QA agent will comment shortly with review notes." \
            --label "agent-pr"

      - name: Comment back on issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment ${{ github.event.issue.number }} --body "Agent run complete. PR opened from \`${{ steps.branch.outputs.name }}\`. Vercel preview is building; QA agent will review shortly."
          else
            gh issue comment ${{ github.event.issue.number }} --body "Agent run failed. Check the workflow logs above. The \`agent-ready\` label has not been removed — re-trigger by clicking 'Re-run jobs' once the cause is fixed."
          fi
